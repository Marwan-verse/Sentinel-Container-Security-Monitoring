services:
  monitor:
    build: .
    user: "0:0"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SENTINEL_MODE: docker
      SENTINEL_DB: /data/sentinel.db
      SENTINEL_FALCO_TOKEN: ${SENTINEL_FALCO_TOKEN:-}
      SENTINEL_SCAN_IMAGES: ${SENTINEL_SCAN_IMAGES:-false}
      TRIVY_CACHE_DIR: /data/trivy-cache
    volumes:
      - sentinel_data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  sentinel_data:

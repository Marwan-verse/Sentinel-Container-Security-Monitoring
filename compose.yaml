services:
  monitor:
    build: .
    user: "0:0"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SENTINEL_MODE: docker
      SENTINEL_DB: /data/sentinel.db
    volumes:
      - sentinel_data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  sentinel_data:
